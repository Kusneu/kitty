
# Include theme
include current-theme.conf

# Shell integration
shell_integration no-sudo
term xterm-256color

# ============ FONTS ============
font_size 19.0
font_family "JetBrainsMono Nerd Font"  # Fixed: was "ont_family"
bold_font auto
italic_font auto
bold_italic_font auto

# ============ TRANSPARENCY ============
background_opacity 0.9
dynamic_background_opacity yes

# ============ LAYOUT ============
enabled_layouts tall,*

# ============ WINDOWS ============
window_border_width 2pt

# ============ TAB BAR ============
tab_bar_style powerline
active_tab_background  #444444
active_tab_foreground  #5fd700
tab_bar_margin_height 0.0 2.0
tab_bar_margin_color  #4f4f4f
tab_activity_symbol *

# ============ CURSOR ============
cursor_trail 1
cursor_shape block

# ============ SHORTCUTS ============
# Unbind conflicting shortcuts
# Note: "forward" isn't a valid Kitty action. Use no_op or proper actions.
map ctrl+shift+left no_op
map ctrl+shift+right no_op
map shift+left no_op
map shift+right no_op

# Tab navigation
map ctrl+shift+[ previous_tab
map ctrl+shift+] next_tab
map ctrl+alt+shift+left previous_window
map ctrl+alt+shift+right next_window

# Window management
map ctrl+shift+enter new_window
map ctrl+shift+v    new_window
map ctrl+shift+h    new_window
map ctrl+shift+w    close_window
map ctrl+shift+q    close_tab

# Tab management
map ctrl+t          new_tab
map ctrl+shift+t    new_tab_with_cwd

# Font size controls (like a browser)
map ctrl+equal      increase_font_size
map ctrl+minus      decrease_font_size
map ctrl+0          restore_font_size

# Alternative font size controls
map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size

# Clipboard
map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard
map shift+insert    paste_from_selection

# Scrolling
map ctrl+shift+up    scroll_line_up
map ctrl+shift+down  scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end

# Clear terminal
map ctrl+shift+k    clear_terminal

# Opacity controls (dynamic transparency)
map alt+a           set_background_opacity +0.05
map alt+s           set_background_opacity -0.05
map alt+r           set_background_opacity 0.85

# ============ PERFORMANCE ============
sync_to_monitor no  # Fixes freezing
repaint_delay 10
input_delay 3

# ============ MISC ============
# Show scrollback in a pager
scrollback_lines 2000
scrollback_pager less +G -Rnclude current-theme.conf
shell_integration no-sudo
term xterm-256color

